<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pendaftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Data Pendaftar</h1>
    <p><a class="link-nav" href="pendaftaran.html">← Kembali ke formulir</a></p>

    <div class="filter-card">
        <div class="form-group">
            <label for="cari">Cari (nama, e-mail, atau prodi)</label>
            <input type="search" id="cari" placeholder="Ketik untuk mencari...">
        </div>
        <span class="badge" id="jumlah"></span>
    </div>

    <div class="actions">
        <button type="button" class="btn btn-secondary" id="muat-ulang">Muat ulang</button>
        <button type="button" class="btn btn-primary" id="ekspor-json">Unduh JSON</button>
        <button type="button" class="btn btn-primary" id="ekspor-csv">Unduh CSV</button>
        <button type="button" class="btn btn-danger" id="hapus-semua">Hapus semua</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>No</th><th>Nama</th><th>E-mail</th><th>HP</th>
                    <th>Pilihan I</th><th>Waktu daftar</th><th>Aksi</th>
                </tr>
            </thead>
            <tbody id="daftar"></tbody>
        </table>
    </div>

    <h2>Detail</h2>
    <div id="detail" class="detail-box"><p>Pilih “Detail” pada salah satu baris.</p></div>
</div>
<script src="script.js"></script>
</body>
</html>
