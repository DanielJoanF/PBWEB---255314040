<!DOCTYPE html>
<html lang="en">

<body>
    <h1>Data Pendaftar</h1>
<p><a href="pendaftaran.html">Kembali ke formulir</a></p>
 
<p>
  <label for="cari">Cari (nama, e-mail, atau prodi)</label>
  <input type="search" id="cari">
  <span id="jumlah"></span>
</p>
 
<p>
  <button type="button" id="muat-ulang">Muat ulang</button>
  <button type="button" id="ekspor-json">Unduh JSON</button>

<table border="1" cellpadding="4">
  <thead>
    <tr>
      <th>No</th><th>Nama</th><th>E-mail</th><th>HP</th>
      <th>Pilihan I</th><th>Waktu daftar</th><th>Aksi</th>

  </thead>

<h2>Detail</h2>
<div id="detail"><p>Pilih “Detail” pada salah satu baris.</p></div>
